name: Release module

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from module.prop without the v prefix
        required: true
        type: string
      version_code:
        description: versionCode from module.prop
        required: true
        type: number
      prerelease:
        description: Publish as a GitHub pre-release
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      VERSION_CODE: ${{ inputs.version_code }}
      PRERELEASE: ${{ inputs.prerelease }}
      UPDATE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/update.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release metadata
        run: |
          tag="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          asset="susfs-studio-${VERSION}-arm64.zip"
          python3 -B scripts/update_manifest.py \
            --module-prop module/module.prop \
            --repository "$GITHUB_REPOSITORY" \
            --version "$VERSION" \
            --version-code "$VERSION_CODE" \
            --asset "$asset" \
            --output "$RUNNER_TEMP/update.json"
          cmp update.json "$RUNNER_TEMP/update.json"
          printf 'TAG=%s\nASSET=%s\n' "$tag" "$asset" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android

      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v3.1.4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install Android NDK and cargo-ndk
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Run script checks
        run: python3 -B -m unittest discover -s scripts -v

      - name: Run native checks
        working-directory: native
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo test --locked -- --ignored --test-threads=1

      - name: Run WebUI checks
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium
          pnpm --dir web check
          pnpm --dir web test:e2e
          pnpm --dir web test:static
          pnpm --dir web build

      - name: Build Android executable
        working-directory: native
        run: cargo ndk -t arm64-v8a -P 26 build --locked

      - name: Package release module
        run: |
          mkdir -p release
          python3 -B scripts/package.py \
            --web web/dist \
            --cli native/target/aarch64-linux-android/debug/studioctl \
            --version "$VERSION" \
            --version-code "$VERSION_CODE" \
            --update-json "$UPDATE_URL" \
            --output "release/$ASSET"
          cp update.json release/update.json
          (cd release && sha256sum "$ASSET" update.json > SHA256SUMS)
          git diff --check

      - name: Sign release assets
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main"
          cosign sign-blob --yes \
            --bundle "release/${ASSET}.bundle" \
            "release/${ASSET}"
          cosign sign-blob --yes \
            --bundle release/SHA256SUMS.bundle \
            release/SHA256SUMS
          cosign verify-blob \
            --bundle "release/${ASSET}.bundle" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "release/${ASSET}"
          cosign verify-blob \
            --bundle release/SHA256SUMS.bundle \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            "$TAG"
            "release/$ASSET"
            "release/${ASSET}.bundle"
            "release/update.json"
            "release/SHA256SUMS"
            "release/SHA256SUMS.bundle"
            --target "$GITHUB_SHA"
            --title "SUSFS Studio $TAG"
            --generate-notes
          )
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
